let db=JSON.parse(localStorage[K]||'null'),cur=null,tab='cl';const sbc=()=>SB0.u?SB0:JSON.parse(localStorage.eps_sb||'null')||(db&&db.sb)||null;let pt;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

const gen=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>a[x%a.length]).join('');return 'EPS-'+r(4)+'-'+r(4)};
const SIT='s:Célibataire,Marié(e),Veuf(ve),Divorcé(e),Séparé(e)';
const FF=[['sx','Sexe','s:Masculin,Féminin'],['lb','Lieu de naissance'],['ad','Adresse'],['mn','Mère — nom et prénom'],['mj','Mère — profession'],['mt','Mère — téléphone','tel'],['mq','Mère — situation familiale',SIT],['pn','Père — nom et prénom'],['pj','Père — profession'],['pt','Père — téléphone','tel'],['pq','Père — situation familiale',SIT],['un','Urgence — nom et prénom'],['ul','Urgence — lien avec l\'élève'],['ut','Urgence — téléphone','tel'],['md','Autorisation photo/vidéo','s:Oui,Non'],['sh','Santé : avez-vous une remarque à signaler ?','s:Pas de remarque,Oui je signale une remarque'],['sa','Précisions (problèmes de santé, allergies à des médicaments…)','ta']];
const R7=[0,1,2,3,4,5,6],INFD=['Trois absences successives non justifiées','Retard de plus de 10 minutes','Absence de tenue sportive adaptée','Tenue non conforme à l\'équipe','Non-respect des consignes du capitaine','Manque de respect envers autrui','Non-respect des consignes de sécurité'];
const fld=(k,l,ty,id)=>`<div id="w_${id}"><label>${l}</label>${!ty?`<input id="${id}">`:ty=='tel'?`<input id="${id}" type="tel">`:ty=='ta'?`<textarea id="${id}" style="min-height:60px"></textarea>`:`<select id="${id}"><option value="">Choisir…</option>${ty.slice(2).split(',').map(o=>`<option>${o}</option>`).join('')}</select>`}</div>`;
const te=new TextEncoder(),xk=async k=>new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('d'+k)));
const encD=async(d,k)=>{const h=await xk(k);return[...te.encode(d)].map((b,i)=>(b^h[i]).toString(16).padStart(2,'0')).join('')};
const decD=async(x,k)=>{const h=await xk(k);return String.fromCharCode(...x.match(/../g).map((b,i)=>parseInt(b,16)^h[i]))};
const hx=u=>[...u].map(b=>b.toString(16).padStart(2,'0')).join(''),unhex=s=>Uint8Array.from(s.match(/../g),h=>parseInt(h,16));
const kdf=async(s,salt)=>new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode(salt),iterations:150000},await crypto.subtle.importKey('raw',te.encode(s),'PBKDF2',false,['deriveBits']),512));
const ident=async c=>{const m=await kdf(c.trim().toUpperCase(),'eps-v4');return{o:hx(m.slice(0,8)),sec:hx(m.slice(8,24)),key:m.slice(32,64)}};
const aes=async(key,d)=>{const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));return b64(new Uint8Array([...iv,...new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(d)))]))};
const unaes=async(key,s)=>{const u=ub(s),k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12)))};
async function push(){const sb=sbc();if(!sb||!db||!db.ek)return;try{const d={et:db.et,nm:db.nm,pr:db.pr,pa:db.pa,ea:db.ea,cl:Object.fromEntries(Object.entries(db.cl).map(([c,v])=>[c,{s:v.s}]))};await rpc(sb,'eps_put',{po:db.o,ps:await H(db.sec),pb:await aes(unhex(db.ek),JSON.stringify(d))})}catch(e){}}
async function upR(c,i,r){const sb=sbc();if(!sb||!db.ek)return;try{await rpc(sb,'eps_set',{po:db.o,ps:await H(db.sec),pc:c,pi:i,pd:r})}catch(e){}}
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');

async function sync(){const sb=sbc();if(!sb||!db.o||!db.ek)return;try{const sh=await H(db.sec);await rpc(sb,'eps_reg',{po:db.o,ps:sh});const R=await rpc(sb,'eps_get',{po:db.o,ps:sh});let n=0;R.forEach(x=>{if(db.cl[x.rc]&&db.cl[x.rc].s[x.ri]){db.cl[x.rc].r[x.ri]=x.rd;n++}});save();return n}catch(e){return'Erreur : '+e.message}}
const fHtml=(M,s,r)=>{const f=r.f||{},fl=(v,w)=>`<span class="f" style="min-width:${w||120}px">${esc(v||'')}</span>`,bx=x=>x?'☒':'☐',L=(a,b)=>`<tr><td>${a}</td><td>${esc(f[b[0]]||'')}</td><td>${esc(f[b[1]]||'')}</td></tr>`;
return`<div class="pg fi"><div class="fc"><table class="hd"><tr><td style="width:134px">${r.ph?`<div class="ph ph2"><img src="${r.ph}"></div>`:'<div class="ph">PHOTO</div>'}</td><td class="br" style="width:50px"><div></div></td><td><div class="hb"><i>LYCÉE</i> : ${esc(M.et)}<br><b><i>ÉDUCATION PHYSIQUE ET SPORTIVE</i></b><br><i><b>PROFESSEUR</b></i> : ${esc(M.p)}<br><i><b>ANNÉE SCOLAIRE</b></i> : 2025/2026</div></td><td class="br" style="width:50px"><div></div></td></tr></table>

async function parse(f){
 const wb=XLSX.read(await f.arrayBuffer()),R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),top=R.slice(0,15);
 let code=(norm(f.name).match(RX)||[])[0]||top.flat().map(c=>(norm(c).match(RX)||[])[0]).find(Boolean);
 if(!code)throw Error('Classe introuvable dans « '+f.name+' » (attendu : TCPS-1, TCSCF-2, 2BACPC-5…)');
 const after=l=>{for(const r of top){const i=r.findIndex(x=>String(x).replace(/[\s:]/g,'')===l);if(i>=0)return String(r.slice(i+1).find(x=>String(x).trim())||'').trim()}return''};
 const S=[];for(const r of R){const i=r.findIndex(x=>/^[A-Z]\d{9}$/.test(String(x).trim()));if(i<0)continue;
  S.push({m:String(r[i]).trim(),ar:String(r[i+1]||'').trim(),dob:String(r.find(x=>/^\d{2}[-\/]\d{2}[-\/]\d{4}$/.test(String(x).trim()))||'').trim()})}
 if(!S.length)throw Error('Aucun élève (code Massar) trouvé dans « '+f.name+' »');
 return{code,S,prof:after('الاستاذ'),etab:after('مؤسسة')}}

async function addFiles(files){const out=[];for(const f of files){const p=await parse(f);db.cl[p.code]={s:p.S,r:db.cl[p.code]?.r||{}};db.pa=db.pa||p.prof;db.ea=db.ea||p.etab;out.push(p.code)}

function home(){location.hash='';$('#ho').innerHTML='';A.innerHTML=`${db?`<p class="s">Espace de <b>${esc(db.pr)} ${esc(db.nm)}</b> détecté sur cet appareil.</p>`:''}<div class="g">
<div class="card"><h2>🆕 Nouveau professeur</h2><p class="s">Première utilisation de la plateforme : créez votre espace et importez vos classes.</p><label>Code d'inscription (commun)</label><input id="g" type="password" placeholder="Code d'inscription"><button onclick="gate()">Créer mon espace</button></div>
<div class="card"><h2>🔑 Déjà inscrit</h2><p class="s">Entrez le code personnel reçu à votre inscription.</p><label>Code personnel</label><input id="c" placeholder="EPS-XXXX-XXXX" onkeydown="if(event.key=='Enter')doLogin()"><button onclick="doLogin()">Accéder à mon tableau de bord</button><br><button class="a" onclick="recover()">Code perdu</button><button class="a" onclick="$('#rf').click()">Nouvel appareil : restaurer ma sauvegarde</button><input id="rf" type="file" accept=".json" style="display:none" onchange="loginRestore(this.files[0])"></div></div><div class="err" id="e"></div>${SB0.u?'':`<details class="card"><summary>⚙ Connexion en ligne ${sbc()?'<span class="ok">(configurée)</span>':'(non configurée)'}</summary><p class="s">À faire une fois par appareil (voir SUPABASE-GUIDE.txt) pour retrouver vos classes sur n'importe quel appareil.</p><div class="g"><div><label>Project URL</label><input id="cu" value="${esc((sbc()||{}).u||'')}"></div><div><label>Clé anon public</label><input id="ck" value="${esc((sbc()||{}).k||'')}"></div></div><button class="a" onclick="localStorage.eps_sb=JSON.stringify({u:$('#cu').value.trim(),k:$('#ck').value.trim()});home()">Enregistrer</button></details>`}`}
function gate(){if($('#g').value.trim()!==GATE)return $('#e').textContent='Code d\'inscription incorrect.';if(db&&!confirm('Un espace existe déjà sur cet appareil ('+db.pr+' '+db.nm+'). Créer un nouvel espace le remplacera. Continuer ?'))return;setup()}
function loginRestore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.ch||!d.cl)throw 0;db=d;save();home();$('#e').innerHTML='<span class="ok">Sauvegarde restaurée. Entrez maintenant votre code personnel.</span>'}catch{$('#e').textContent='Fichier de sauvegarde invalide.'}};r.readAsText(f)}
function setup(){A.innerHTML=`<div class="card"><h2>Créer mon espace professeur</h2><p class="s">Importez vos fichiers Massar (jusqu'à 9). Le niveau, la filière et le numéro de classe sont lus dans le nom du fichier (ex. TCPS-1, TCSCF-2, 2BACPC-5).</p>
<div class="g"><div><label>Établissement</label><input id="et"></div><div><label>Nom</label><input id="nm"></div><div><label>Prénom</label><input id="pr"></div></div>
<label>Fichiers Excel des classes (.xlsx)</label><input id="fl" type="file" accept=".xlsx,.xls" multiple>
<h3>Récupération du code (si vous l'oubliez)</h3><div class="g"><div><label>Date de naissance</label><input id="db" type="date"></div><div><label>Question secrète</label><select id="qq">${Q.map((q,i)=>`<option value="${i}">${q}</option>`)}</select></div><div><label>Réponse</label><input id="an"></div></div>
<button onclick="create()">Créer et importer</button><button class="a" onclick="home()">← Retour</button><div class="err" id="e"></div></div>`}
async function create(){const v=i=>$('#'+i).value.trim(),fs=[...$('#fl').files];
 if(!v('et')||!v('nm')||!v('pr')||!v('db')||!v('an')||!fs.length)return $('#e').textContent='Tous les champs et au moins un fichier sont obligatoires.';
 if(fs.length>9)return $('#e').textContent='Maximum 9 fichiers.';
 try{const code=gen(),id=await ident(code),rs=nz([v('nm'),v('pr'),v('db'),$('#qq').value,v('an')].join('|'));db={et:v('et'),nm:v('nm'),pr:v('pr'),ch:await H(code),rh:await H(rs),cl:{},o:id.o,sec:id.sec,ek:hx(id.key)};
 const c=await addFiles(fs);save();sessionStorage.in=1;let w='';if(sbc()){try{await rpc(sbc(),'eps_reg',{po:db.o,ps:await H(db.sec)});await push();const m=await kdf(rs,'eps-rec');await rpc(sbc(),'eps_recput',{pr:hx(m.slice(0,16)),pw:await aes(m.slice(32,64),code)})}catch(e){w=e.message}}
 A.innerHTML=`<div class="card"><h2>Espace créé ✔</h2><p>${c.length} classe(s) importée(s) : <b>${c.join(', ')}</b></p><p>Votre code personnel pour revenir plus tard :</p><div class="code">${code}</div><p class="s">Notez-le maintenant : il n'est plus affiché ensuite. En cas de perte : « Code perdu » (nom, prénom, date de naissance, réponse secrète).</p>${w?'<p class="err">Compte en ligne non créé : '+esc(w)+'</p>':sbc()?'<p class="ok">Compte synchronisé en ligne : ce code suffit pour vous connecter depuis n\'importe quel appareil.</p>':'<p class="s">Mode hors ligne : vos données restent sur cet appareil (faites des sauvegardes JSON).</p>'}<button onclick="dash()">Ouvrir mon tableau de bord</button></div>`}catch(e){db=JSON.parse(localStorage[K]||'null');$('#e').textContent=e.message}}

function login(){home()}
async function doLogin(){const code=$('#c').value.trim().toUpperCase();if(!code)return;
 if(db&&await H(code)===db.ch){sessionStorage.in=1;return dash()}
 const sb=sbc();if(!sb)return $('#e').textContent=db?'Code incorrect.':'Aucun espace sur cet appareil : choisissez « Nouveau professeur » ou restaurez votre sauvegarde.';
 try{$('#e').textContent='Connexion…';const id=await ident(code),bl=await rpc(sb,'eps_load',{po:id.o,ps:await H(id.sec)});if(!bl)return $('#e').textContent='Code incorrect ou compte introuvable.';
  const d=JSON.parse(await unaes(id.key,bl));for(const c in d.cl)d.cl[c].r={};db={...d,o:id.o,sec:id.sec,ek:hx(id.key),ch:await H(code),rh:''};save();sessionStorage.in=1;dash()}catch(e){$('#e').textContent='Connexion impossible : '+e.message}}
function recover(){if(!db&&!sbc())return $('#e').textContent='Aucun espace sur cet appareil : restaurez votre sauvegarde ou créez un nouvel espace.';A.innerHTML=`<div class="card"><h2>Récupérer mon accès</h2><div class="g"><div><label>Nom</label><input id="nm"></div><div><label>Prénom</label><input id="pr"></div><div><label>Date de naissance</label><input id="db" type="date"></div><div><label>Question</label><select id="qq">${Q.map((q,i)=>`<option value="${i}">${q}</option>`)}</select></div><div><label>Réponse</label><input id="an"></div></div><button onclick="doRec()">Générer un nouveau code</button><button class="a" onclick="home()">← Retour</button><div class="err" id="e"></div></div>`}
async function doRec(){const v=i=>$('#'+i).value.trim(),sb=sbc();
 if(sb){try{const m=await kdf(nz([v('nm'),v('pr'),v('db'),$('#qq').value,v('an')].join('|')),'eps-rec'),w=await rpc(sb,'eps_recget',{pr:hx(m.slice(0,16))});if(!w)return $('#e').textContent='Informations incorrectes.';const code=await unaes(m.slice(32,64),w);return A.innerHTML=`<div class="card"><h2>Votre code personnel</h2><div class="code">${esc(code)}</div><button onclick="home()">Me connecter</button></div>`}catch(e){return $('#e').textContent='Informations incorrectes ou connexion impossible.'}}
 if(!db)return;if(await H(nz([v('nm'),v('pr'),v('db'),$('#qq').value,v('an')].join('|')))!==db.rh)return $('#e').textContent='Informations incorrectes.';
 const c=gen();db.ch=await H(c);save();sessionStorage.in=1;A.innerHTML=`<div class="card"><h2>Nouveau code</h2><div class="code">${c}</div><button onclick="dash()">Ouvrir mon tableau de bord</button></div>`}

function stats(c){const S=db.cl[c].s,ag=S.map(s=>+(s.dob.split(/[-\/]/)[2]||0)).filter(Boolean).map(y=>2026-y);return{n:S.length,age:M(ag),rep:Object.values(db.cl[c].r).filter(x=>x.f).length}}

function dash(t){if(!db||!sessionStorage.in)return home();if(sbc()&&Date.now()-(dash.l||0)>15000){dash.l=Date.now();sync().then(r=>{dash.err=typeof r=='string'?r:'';dash()})}tab=t||tab;cur=cur&&db.cl[cur]?cur:sortC()[0];
 $('#hs').textContent=db.et+' · '+db.pr+' '+db.nm;$('#ho').innerHTML='<button class="a" onclick="sessionStorage.removeItem(\'in\');home()">Quitter</button>';
 const T=[['cl','Classes & analyses'],['sn','Santé & autorisations'],['bd','Base de données'],['qr','QR codes élèves'],['rp','Réponses reçues'],['pf','Profil']];
 let h='<div class="tabs">'+T.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="dash('${x[0]}')">${x[1]}</button>`).join('')+'</div>';
 if(tab=='cl')h+=vCl();if(tab=='sn')h+=vSn();if(tab=='bd')h+=vBd();if(tab=='qr')h+=vQr();if(tab=='rp')h+=vRp();if(tab=='pf')h+=vPf();A.innerHTML=h;if(tab=='qr')drawQr();if(tab=='bd'&&ed!=null)FF.forEach(k=>{$('#e_f_'+k[0]).value=(db.cl[cur].r[ed]?.f||{})[k[0]]||''})}

let bq='',ed=null,miss=0;
const dl=(n,b)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};
const pc=r=>{const p=r&&r.f?Math.round(100*(FF.filter(k=>k[0]!='sa'&&r.f[k[0]]).length+(r.ph?1:0))/FF.length):0;return`<div class="pb" style="margin:0;cursor:default"><div class="tr"><i style="width:${p}%"></i></div><span style="width:44px">${p}%</span></div>`};
const pbar=c=>{const s=stats(c),p=s.n?Math.round(100*s.rep/s.n):0;return`<div class="pb" onclick="miss=cur=='${c}'?!miss:1;cur='${c}';dash('cl')"><b>${c}</b><div class="tr"><i style="width:${p}%"></i></div><span>${s.rep}/${s.n} · ${p}%</span></div>`};
const missP=c=>{const S=db.cl[c].s,R=db.cl[c].r,no=S.filter((_,i)=>!(R[i]&&R[i].f)),ok=S.filter((_,i)=>R[i]&&R[i].f);return`<div class="card" style="background:#fafcfd"><b>${c} — fiche non remplie (${no.length}) :</b><p class="ar">${no.map(x=>'✖ '+esc(x.ar)).join(' &nbsp; ')||'Tous ont rempli ✔'}</p><b>Fiche remplie (${ok.length}) :</b><p class="ar">${ok.map(x=>'✔ '+esc(x.ar)).join(' &nbsp; ')||'—'}</p></div>`};
const hasH=r=>r&&r.f&&((r.f.sh&&r.f.sh.startsWith('Oui'))||(!r.f.sh&&r.f.sa&&!/^\s*(rien|aucun|ras|non|néant|pas de remarque)/i.test(r.f.sa)));
const eachR=fn=>{const o=[];for(const c of sortC())db.cl[c].s.forEach((s,i)=>{const r=db.cl[c].r[i];const x=fn(c,s,r);if(x)o.push(x)});return o};
const hrows=()=>eachR((c,s,r)=>hasH(r)&&[c,s.ar,(r.fn||'')+' '+(r.fp||''),r.f.sa||'',r.f.un||'',r.f.ut||'']);
const prows=()=>eachR((c,s,r)=>r&&r.f&&r.f.md=='Non'&&[c,s.ar,(r.fn||'')+' '+(r.fp||''),'Refus confirmé (participation limitée)',r.f.un||'',r.f.ut||'']);
const HH=['Classe','Nom (arabe)','Nom / Prénom','Remarque santé','Contact d\'urgence','Téléphone'],HP=['Classe','Nom (arabe)','Nom / Prénom','Décision','Contact d\'urgence','Téléphone'];
const tbl=(h,R)=>`<table class="rc"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${R.map(r=>`<tr>${r.map((x,i)=>`<td${i==1?' class="ar"':''}>${esc(x)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Aucun élève.</td></tr>`}</table>`;
function rows(c,full){return db.cl[c].s.map((s,i)=>{const r=db.cl[c].r[i]||{};return[i+1,s.ar,r.fn||'',r.fp||'',s.m,s.dob,c,LV[lv(c)],...(full?FF.map(k=>(r.f||{})[k[0]]||''):[])]})}
const HD=['N°','Nom (arabe)','Nom (français)','Prénom (français)','Code Massar','Date de naissance','Classe','Niveau'],HF=[...HD,...FF.map(k=>k[1])];
const teams=c=>Object.entries(db.cl[c].r).filter(x=>x[1].t);
function vCl(){const cs=sortC(),c=cur,s=stats(c);
 return`<div class="card"><h2>Mes classes</h2><div class="tabs">${cs.map(x=>`<button class="${x==c?'on':''}" onclick="cur='${x}';dash()">${x}</button>`).join('')}</div>
<p class="s">${LV[lv(c)]} · classe ${c}</p>
<div class="k"><div><b>${s.n}</b>élèves</div><div><b>${f1(s.age)}</b>âge moyen</div><div><b>${s.rep}/${s.n}</b>fiches reçues</div></div>
<h3>Progression du remplissage <span class="s">(cliquez sur une classe pour voir qui reste)</span></h3>${cs.map(pbar).join('')}${miss?missP(c):''}<button onclick="xl('${c}')">Excel — ${c}</button><button class="a" onclick="xl()">Excel — toutes les classes</button><button class="a" onclick="pdf('${c}')">PDF — ${c}</button><button class="a" onclick="gpdf('${c}',0)">PDF groupé — fiches</button><button class="a" onclick="gpdf('${c}',1)">PDF groupé — contrats</button><button class="a" onclick="refresh()">↻ Actualiser</button><button class="a" onclick="addMore()">+ Importer une classe</button><input id="more" type="file" accept=".xlsx,.xls" multiple style="display:none" onchange="doMore(this.files)"><div class="err" id="e">${esc(dash.err||'')}</div>
<h3>Liste de la classe</h3><div class="w"><table><tr>${HD.map(x=>`<th>${x}</th>`).join('')}<th>Remplissage</th><th>Fiche</th></tr>${rows(c).map((r,n)=>'<tr>'+r.map((x,i)=>`<td${i==1?' class="ar"':''}>${esc(x)}</td>`).join('')+`<td>${pc(db.cl[c].r[n])}</td><td>${db.cl[c].r[n]?.f?`<button class="a" style="margin:0" onclick="fpdf('${c}',${n})">Voir / PDF</button>`:'–'}</td></tr>`).join('')}</table></div>
<h3>Contrats d'équipe reçus (${teams(c).length})</h3><div class="w"><table><tr><th>Équipe</th><th>Couleur</th><th>Capitaine</th><th>Membres</th><th></th></tr>${teams(c).map(([i,r])=>`<tr><td>${esc(r.t.n)}</td><td>${esc(r.t.c)}</td><td>${esc(r.t.cp)}</td><td>${esc(r.t.m)}</td><td><button class="a" style="margin:0" onclick="tpdf('${c}',${i})">Voir / PDF</button></td></tr>`).join('')||'<tr><td colspan=5>Aucun contrat reçu.</td></tr>'}</table></div></div>`}
function fit(){const p=$('#pa');p.style.cssText='display:block;position:absolute;left:-9999px;top:0;width:188mm';p.querySelectorAll('.fc').forEach(c=>{c.style.zoom=1;const H=c.parentNode.clientHeight-(c.nextElementSibling?44:6);c.style.zoom=Math.max(.55,Math.min(1.3,H/c.offsetHeight))});p.style.cssText=''}
function prt(){fit();print()}
const MM=c=>({et:db.et,p:db.pr+' '+db.nm,c});
function fpdf(c,i){$('#pa').innerHTML=fHtml(MM(c),db.cl[c].s[i],db.cl[c].r[i]);prt()}
function tpdf(c,i){$('#pa').innerHTML=tHtml(MM(c),db.cl[c].r[i].t);prt()}
function gpdf(c,k){const R=db.cl[c].r,S=db.cl[c].s,h=Object.keys(R).sort((x,y)=>x-y).filter(i=>k?R[i].t:R[i].f).map(i=>k?tHtml(MM(c),R[i].t):fHtml(MM(c),S[i],R[i])).join('');if(!h)return alert('Rien à imprimer pour le moment.');$('#pa').innerHTML=h;prt()}
async function refresh(){dash.l=0;$('#e').textContent='Actualisation…';const n=await sync();dash.l=Date.now();dash()}
function addMore(){$('#more').click()}
async function doMore(fs){try{await addFiles(fs);save();dash()}catch(e){$('#e').textContent=e.message}}
function xl(c){const wb=XLSX.utils.book_new(),ks=c?[c]:sortC(),T=[['Classe','Équipe','Couleur','Capitaine','Membres','Engagements','Date','N°','Infraction','Sanction']];for(const k of ks){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HF,...rows(k,1)]),k);teams(k).forEach(([i,r])=>R7.forEach(j=>T.push([k,r.t.n,r.t.c,r.t.cp,r.t.m,'',r.t.d,j+1,(r.t.v||[])[j]||'',(r.t.s||[])[j]||''])))}if(T.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(T),'Contrats équipes');XLSX.writeFile(wb,'EPS_'+(c||'toutes_classes')+'.xlsx')}
function pdf(c){$('#pa').innerHTML=`<h2>${esc(db.et)} — Classe ${c} (${LV[lv(c)]})</h2><p>Professeur : ${esc(db.pr)} ${esc(db.nm)} · Année 2025/2026</p><table class="rc"><tr>${HD.map(x=>`<th>${x}</th>`).join('')}</tr>${rows(c).map(r=>'<tr>'+r.map((x,i)=>`<td${i==1?' class="ar"':''}>${esc(x)}</td>`).join('')+'</tr>').join('')}</table>`;prt()}

function vQr(){return`<div class="card"><h2>QR codes par classe</h2><p class="s">Un QR par classe : l'élève scanne, retrouve son nom dans la liste de <b>sa</b> classe uniquement, puis remplit sa fiche de renseignements (et le contrat d'équipe s'il est capitaine). Le QR ne contient ni code Massar ni date de naissance (la clé publique de connexion y est incluse, c'est normal). Le site doit être hébergé en ligne (https) pour que le lien fonctionne sur les téléphones.</p><button onclick="pa()">Imprimer / PDF des QR</button><div class="g" id="qg" style="margin-top:12px"></div></div>`}
async function link(c){const S=await Promise.all(db.cl[c].s.map(async s=>[s.ar,(await H(c+s.m)).slice(0,6),await encD(s.dob||'',c+s.m)]));return location.href.split('#')[0]+'#q='+pack({c,e:db.et,p:db.pr+' '+db.nm,s:S,...(sbc()?{o:db.o,u:sbc().u,k:sbc().k}:{})})}
async function qrs(){const o=[];for(const c of sortC()){const u=await link(c);let q='';try{const x=qrcode(0,'L');x.addData(u,'Byte');x.make();q=x.createSvgTag({cellSize:5,margin:2,scalable:true})}catch{q='<p class="err">Classe trop grande pour un QR</p>'}o.push(`<div class="qr">${q}<h3 style="margin:6px 0">${c}</h3><div class="s">${LV[lv(c)]} · ${db.cl[c].s.length} élèves<br>Prof. ${esc(db.pr)} ${esc(db.nm)}</div></div>`)}return o.join('')}
async function drawQr(){$('#qg').innerHTML=await qrs()}async function pa(){$('#pa').innerHTML=await qrs();prt()}

function vRp(){return`<div class="card"><h2>Réponses des élèves</h2><p class="s">Après validation, l'élève reçoit un code réponse (et un bouton WhatsApp). Collez ici les codes reçus, un par ligne.</p><textarea id="rc" placeholder="R1.xxxxxxxx"></textarea><button onclick="impR()">Importer</button><div id="e" class="err"></div></div>`}
function impR(){let n=0,bad=0;for(const l of $('#rc').value.split(/\s+/).filter(Boolean)){try{const o=unpack(l.replace(/^R1\./,''));if(db.cl[o.c]&&db.cl[o.c].s[o.i]){db.cl[o.c].r[o.i]={fn:o.n,fp:o.p,ar:o.a,f:o.f||{},t:o.t||null};upR(o.c,o.i,db.cl[o.c].r[o.i]);n++}else bad++}catch{bad++}}save();$('#e').innerHTML=`<span class="ok">${n} importée(s)</span>${bad?' · '+bad+' invalide(s)':''}`}
function vPf(){const b=sbc()||{};return`<div class="card"><h2>Connexion en ligne (réception automatique)</h2><p class="s">${sbc()?'<span class="ok">Configurée</span> — les fiches arrivent automatiquement dans votre tableau de bord.':'Non configurée : les élèves devront envoyer un code. Suivez SUPABASE-GUIDE.txt (gratuit, 10 minutes).'}</p><div class="g"><div><label>Project URL</label><input id="su" value="${esc(b.u||'')}" placeholder="https://xxxx.supabase.co"></div><div><label>Clé publique (anon public)</label><input id="sk" value="${esc(b.k||'')}"></div></div><button onclick="saveSb()">Enregistrer et tester</button><div id="e2" class="s"></div></div>
<div class="card"><h2>Profil</h2><p>${esc(db.pr)} ${esc(db.nm)} — ${esc(db.et)}</p><p class="s">Nom arabe : ${esc(db.pa||'–')} · ${sortC().length} classe(s)</p><button class="a" onclick="wipe(0)">Supprimer les fiches reçues (fin d'année)</button><button class="r" onclick="wipe(1)">Supprimer mon compte en ligne</button><button class="a" onclick="rc()">Générer un nouveau code</button><button class="r" onclick="if(confirm('Tout effacer sur cet appareil ?')){localStorage.removeItem(K);sessionStorage.clear();db=null;home()}">Effacer mes données</button><div id="e"></div></div>`}
async function saveSb(){db.sb={u:$('#su').value.trim(),k:$('#sk').value.trim()};localStorage.eps_sb=JSON.stringify(db.sb);save();$('#e2').textContent='Test en cours…';const n=await sync();$('#e2').innerHTML=typeof n=='number'?`<span class="ok">Connexion réussie (${n} réponse(s) reçue(s)). Régénérez maintenant vos QR codes.</span>`:`<span class="err">${esc(n)}</span>`}
function vSn(){const A1=hrows(),B1=prows();return`<div class="card"><h2>Santé & autorisations</h2><div class="k"><div><b>${A1.length}</b>élève(s) avec une remarque santé</div><div><b>${B1.length}</b>refus photo/vidéo</div></div>
<h3>Récapitulatif santé <span class="s">(les élèves « Pas de remarque » n'apparaissent pas)</span></h3><div class="w">${tbl(HH,A1)}</div>
<h3>Refus d'autorisation photo / vidéo</h3><div class="w">${tbl(HP,B1)}</div><button onclick="xs()">Excel</button><button class="a" onclick="ps()">PDF</button></div>`}

function ps(){$('#pa').innerHTML=`<h2>${esc(db.et)} — Récapitulatif santé et autorisations</h2><p>Professeur : ${esc(db.pr)} ${esc(db.nm)} · 2025/2026 · Document confidentiel</p><h3>Santé</h3>${tbl(HH,hrows())}<h3>Refus d'autorisation photo / vidéo</h3>${tbl(HP,prows())}`;prt()}
